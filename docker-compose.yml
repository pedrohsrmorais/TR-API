# TR-API: stack completa.
#   docker compose up -d --build   -> http://localhost:3041
# Todas as variáveis têm default de desenvolvimento; o .env só é necessário para sobrescrever.

name: tr-api

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORTA: 3306
  DB_NOME: tr_api
  DB_USUARIO: ${MYSQL_USER:-tr_api}
  DB_SENHA: ${MYSQL_PASSWORD:-tr_api_dev}

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGIAO: ${S3_REGIAO:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-tr-api-processos}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin123}}
  S3_FORCAR_PATH_STYLE: ${S3_FORCAR_PATH_STYLE:-true}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: tr_api
      MYSQL_USER: ${MYSQL_USER:-tr_api}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tr_api_dev}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORTA_HOST:-3307}:3306"
    healthcheck:
      # via TCP + consulta real: só fica saudável depois que o init.sql terminou
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1 FROM tr_api.schema_info LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    build:
      context: ./infra/minio
    image: tr-api/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORTA_API:-9000}:9000"
      - "${MINIO_PORTA_CONSOLE:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      NODE_ENV: ${NODE_ENV:-production}
      PORTA: 3041
      JWT_SEGREDO: ${JWT_SEGREDO:-dev-troque-este-segredo-em-producao}
      JWT_EXPIRA_EM: ${JWT_EXPIRA_EM:-12h}
      S3_CRIAR_BUCKET: ${S3_CRIAR_BUCKET:-true}
      DJEN_BASE_URL: ${DJEN_BASE_URL:-https://comunicaapi.pje.jus.br}
      DJEN_TIMEOUT_MS: ${DJEN_TIMEOUT_MS:-20000}
      DJEN_ITENS_POR_PAGINA: ${DJEN_ITENS_POR_PAGINA:-50}
      DJEN_MAX_PAGINAS: ${DJEN_MAX_PAGINAS:-10}
      DJEN_MOCK: ${DJEN_MOCK:-false}
      DOWNLOAD_SEGMENTOS_HABILITADOS: ${DOWNLOAD_SEGMENTOS_HABILITADOS:-5}
      LOG_NIVEL: ${LOG_NIVEL:-info}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3041/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb" # Chromium precisa de /dev/shm maior que o padrão de 64 MB
    environment:
      <<: [*db-env, *s3-env]
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_SIMULACAO: ${WORKER_SIMULACAO:-true}
      WORKER_INTERVALO_MS: ${WORKER_INTERVALO_MS:-3000}
      WORKER_HEADLESS: ${WORKER_HEADLESS:-true}
      WORKER_TIMEOUT_JOB_MS: ${WORKER_TIMEOUT_JOB_MS:-600000}
      WORKER_HEARTBEAT_EXPIRA_S: ${WORKER_HEARTBEAT_EXPIRA_S:-120}
      LOG_NIVEL: ${LOG_NIVEL:-info}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy # o backend garante que o bucket existe

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORTA:-3041}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
